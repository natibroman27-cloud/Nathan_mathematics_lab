const GLOS=[
["Matrix","A rectangular table of numbers treated as a single object."],["Order","The size of a matrix, rows × columns."],["Entry","One number in a matrix, a_ij in row i, column j."],["Square matrix","A matrix with equal numbers of rows and columns."],["Identity matrix","Square matrix with 1s on the diagonal and 0s elsewhere; IA = AI = A."],["Diagonal / triangular","Non-zero entries only on the diagonal / only on or above (below) it."],["Determinant","A number from a square matrix: the signed area or volume scale factor."],["Singular","A matrix with determinant 0: it flattens space and has no inverse."],["Minor / cofactor","The determinant left after deleting a row and column / the minor with its checkerboard sign."],["Adjugate","The transpose of the cofactor matrix; A⁻¹ = adj A / det A."],["Inverse","The matrix that undoes A: AA⁻¹ = I."],["Augmented matrix","The coefficient matrix with the right-hand side attached as an extra column."],["Row operation","Swap rows, scale a row, or add a multiple of one row to another; never changes the solutions."],["Pivot","The leading non-zero entry of a row after elimination."],["Consistent / inconsistent","A system with at least one solution / with none (a row reading 0 = c, c ≠ 0)."],["Linear transformation","A map that preserves addition and scaling; every one is a matrix."],["Linear independence","No vector in the set is a combination of the others."],["Span / basis","All combinations of some vectors / an independent set that spans the whole space."],["Eigenvector / eigenvalue","A direction Av = λv that A only stretches, and the stretch factor λ."],
["Function","A rule giving exactly one output for each input."],["Domain / range","The allowed inputs / the outputs that occur."],["Composition","Applying one function after another: (f∘g)(x) = f(g(x))."],["Limit","The value f(x) approaches as x approaches a, ignoring x = a itself."],["One-sided limit","A limit approached from the left or right only."],["Continuity","No gap, jump or hole: f(a) exists and equals the limit."],["Asymptote","A line a graph approaches without reaching: vertical (blow-up) or horizontal (limit at infinity)."],["Indeterminate form","An expression like 0/0 or ∞/∞ that needs more work to find a limit."],["Secant / tangent","A line through two points of a curve / the limit of secants, touching at one point."],["Derivative","Instantaneous rate of change; the slope of the tangent line."],["Critical point","A point where f′ = 0 or is undefined, a candidate for a maximum or minimum."],["Concavity","Whether a graph bends like a bowl (f″ > 0) or a frown (f″ < 0)."],["Inflection point","Where concavity changes."],["Related rates","Finding one rate from another by differentiating a formula in time."],["Antiderivative","A function F with F′ = f; determined up to + C."],["Definite integral","The signed area under a graph, or accumulated change."],["Riemann sum","A sum of rectangle areas approximating an integral."],["Fundamental Theorem","Differentiation and integration are inverse processes: ∫ f = F(b) − F(a)."],["Series","An infinite sum, defined as the limit of its partial sums."],["Radius of convergence","How far from the centre a power series converges."],["Taylor series","A function written as a power series built from its derivatives at one point."],["Differential equation","An equation relating a function to its derivatives."],["Slope field","A grid of short lines showing the slope a differential equation prescribes everywhere."],["Partial derivative","The derivative in one variable with the others held constant."],["Gradient","The vector of partial derivatives; it points in the direction of steepest ascent."]

function lib(){
  $("#v").innerHTML=`<h1>Formula library and glossary</h1><p class="mute">Every formula here comes with a derivation in its lesson. Use this for quick lookup, not memorising.</p><div class="row"><input type="text" id="lq" placeholder="Search…" aria-label="search" style="flex:1;min-width:160px"><select id="lc"><option>All</option><option>Matrices</option><option>Calculus</option><option>Glossary</option></select></div><div id="lr"></div>`;

  const F=FORM.filter(f=>(c=="All"||c==f[0])&&ok(f)),G=GLOS.filter(g=>(c=="All"||c=="Glossary")&&ok(g));

/* ---------- Matrix Lab ---------- */
let A,B;
function lab(){
  $("#v").innerHTML=`<h1>Matrix lab</h1><p class="mute">Edit sizes and entries, then run an operation. Invalid input is explained, not ignored.</p>
  <div class="grid"><div class="card"><h3>Matrix A</h3><div class="row"><select id="ar">${[1,2,3,4].map(n=>`<option ${n==2?"selected":""}>${n}</option>`)}</select>×<select id="ac">${[1,2,3,4].map(n=>`<option ${n==2?"selected":""}>${n}</option>`)}</select></div><div id="A" style="overflow-x:auto"></div></div>
  <div class="card"><h3>Matrix B</h3><div class="row"><select id="br">${[1,2,3,4].map(n=>`<option ${n==2?"selected":""}>${n}</option>`)}</select>×<select id="bc">${[1,2,3,4].map(n=>`<option ${n==2?"selected":""}>${n}</option>`)}</select></div><div id="B" style="overflow-x:auto"></div></div></div>
  <div class="row"><button class="b" onclick="op('add')">A + B</button><button class="b" onclick="op('sub')">A − B</button><button class="b" onclick="op('mul')">A × B</button><button class="g" onclick="op('detA')">det A</button><button class="g" onclick="op('detB')">det B</button><button class="g" onclick="op('invA')">Inverse of A</button><button class="g" onclick="op('gA')">Solve [A | B] by elimination</button><button class="g" onclick="op('trA')">Transform grid of A</button></div>
  <div class="row" style="margin-top:10px">k = <input class="n" type="number" step="any" id="k" value="2" style="width:80px"> <button class="g" onclick="op('sA')">k·A</button><button class="g" onclick="op('sB')">k·B</button></div>
  <div class="card" id="out"><span class="mute">Results and step-by-step working appear here.</span></div>`;
  A=Ed($("#A"),2,2,[[1,2],[3,4]]);B=Ed($("#B"),2,2,[[0,1],[1,0]]);
  $("#ar").onchange=$("#ac").onchange=()=>A.resize(+$("#ar").value,+$("#ac").value);
  $("#br").onchange=$("#bc").onchange=()=>B.resize(+$("#br").value,+$("#bc").value)}
function op(t){const out=$("#out"),a=A.get(),b=B.get(),E=m=>out.innerHTML=`<span class="err">${m}</span>`;
  if(a.err||b.err)return E(a.err?"Matrix A: "+a.err:"Matrix B: "+b.err);
  const X=a.m,Y=b.m;
  if(t=="add"||t=="sub"){const s=t=="add"?1:-1;
    if(X.length!=Y.length||X[0].length!=Y[0].length)return E(`Cannot ${t=="add"?"add":"subtract"}: A is ${X.length}×${X[0].length} but B is ${Y.length}×${Y[0].length}. Addition works entry by entry, so both orders must match.`);
    out.innerHTML=show(X.map((r,i)=>r.map((x,j)=>x+s*Y[i][j])))+`<p class="mute">Each entry: a<sub>ij</sub> ${s>0?"+":"−"} b<sub>ij</sub>.</p>`}
  if(t=="sA"||t=="sB"){const k=Number($("#k").value);if(!isFinite(k)||$("#k").value==="")return E("k must be a number.");const M=t=="sA"?X:Y;out.innerHTML=show(M.map(r=>r.map(x=>k*x)))+`<p class="mute">Every entry is multiplied by k = ${fmt(k)}.</p>`}
  if(t=="detA"||t=="detB"){const M=t=="detA"?X:Y,n=M.length;
    if(n!=M[0].length)return E(`Determinant needs a square matrix, but this one is ${n}×${M[0].length}.`);
    if(n>3)return E("This lab computes determinants up to 3×3 for now.");
    const d=det(M);out.innerHTML=`<div class="step">det = ${fmt(d)}</div>`+(n==2?`<div class="step">ad − bc = (${fmt(M[0][0])})(${fmt(M[1][1])}) − (${fmt(M[0][1])})(${fmt(M[1][0])})</div>`:"")+`<p class="${d==0?"err":"ok"}">${d==0?"Determinant is 0: this matrix is singular (no inverse).":"Determinant is non-zero: this matrix is non-singular."}</p>`}
  if(t=="invA"){const n=X.length;if(n!=X[0].length)return E(`Only square matrices can have an inverse; A is ${n}×${X[0].length}.`);if(n>4)return E("The lab handles inverses up to 4×4.");
    const r=inv(X);if(r.d==0){out.innerHTML=`<div class="step">det A = 0</div><p class="err">A is singular, so it has no inverse. It flattens space, losing information that no matrix could restore. Look for a row or column that is a combination of the others.</p>`;return}
    const P=mm(X,r.inv),ok=P.every((row,i)=>row.every((x,j)=>Math.abs(x-(i==j?1:0))<1e-9));
    out.innerHTML=`<div class="step">det A = ${fmt(r.d)} ≠ 0</div><div class="step">Cofactor matrix</div>${show(r.cof)}<div class="step">Adjugate (transpose)</div>${show(r.adj)}<div class="step">A⁻¹ = adjugate / ${fmt(r.d)}</div>${show(r.inv)}<div class="step">Check A · A⁻¹</div>${show(P)}<p class="${ok?"ok":"err"}">${ok?"= I ✓":"Not the identity."}</p>`}
  if(t=="gA"){if(Y.length!=X.length||Y[0].length!=1)return E(`For elimination, B must be a single column with the same number of rows as A (A has ${X.length} rows; B is ${Y.length}×${Y[0].length}). Set B to ${X.length}×1.`);
    const r=gauss(X.map((row,i)=>[...row,Y[i][0]])),V=["x","y","z","w"];
    let v;if(r.bad>=0)v=`<p class="err">Row ${r.bad+1} reads 0 = ${fmt(r.M[r.bad][r.w])}: no solution (inconsistent).</p>`;else if(r.piv.length<r.w)v=`<p class="ok">${r.piv.length} pivot(s) for ${r.w} unknowns: infinitely many solutions (${r.w-r.piv.length} free variable).</p>`;else v=`<p class="ok">Unique solution: ${r.M.map((row,i)=>`${V[i]||"x"+(i+1)} = ${fmt(row[r.w])}`).join(", ")}</p>`;
    out.innerHTML=(r.st.length?r.st.map(s=>`<div class="step">${s[0]}</div>${show(s[1])}`).join(""):`<p class="mute">Already reduced.</p>`)+v+`<p class="mute">Last column is the right-hand side.</p>`}
  if(t=="trA"){if(X.length!=2||X[0].length!=2)return E("The transformation grid needs a 2×2 matrix A.");
    const a=X[0][0],b=X[0][1],c=X[1][0],d=X[1][1],dt=a*d-b*c,T=(x,y)=>[a*x+b*y,c*x+d*y],ext=Math.max(3,...[[3,3],[-3,3],[3,-3],[-3,-3]].map(p=>Math.max(...T(...p).map(Math.abs)))),k=140/ext,PX=x=>150+x*k,PY=y=>150-y*k,col=Math.abs(dt)<1e-9?"#ef6f6c":dt>0?"#58d1c4":"#f0b84d";let s="";
    for(let i=-3;i<=3;i++){const p=T(i,-3),q=T(i,3),r=T(-3,i),u=T(3,i);s+=`<line x1="${PX(i)}" y1="${PY(-3)}" x2="${PX(i)}" y2="${PY(3)}" stroke="#26344d"/><line x1="${PX(-3)}" y1="${PY(i)}" x2="${PX(3)}" y2="${PY(i)}" stroke="#26344d"/><line x1="${PX(p[0])}" y1="${PY(p[1])}" x2="${PX(q[0])}" y2="${PY(q[1])}" stroke="#3b6aa0"/><line x1="${PX(r[0])}" y1="${PY(r[1])}" x2="${PX(u[0])}" y2="${PY(u[1])}" stroke="#3b6aa0"/>`}
    s+=`<polygon points="${PX(0)},${PY(0)} ${PX(a)},${PY(c)} ${PX(a+b)},${PY(c+d)} ${PX(b)},${PY(d)}" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2"/>`;
    out.innerHTML=`<svg viewBox="0 0 300 300" width="100%" style="max-width:340px;background:#0b111c;border-radius:8px" role="img" aria-label="transformed grid">${s}</svg><div class="step">det A = ${fmt(dt)}</div><p class="${Math.abs(dt)<1e-9?"err":"mute"}">${Math.abs(dt)<1e-9?"Singular: the whole plane is flattened onto a line or point.":dt<0?"Non-singular; areas scale by "+fmt(-dt)+" and orientation is flipped.":"Non-singular; areas scale by "+fmt(dt)+"."}</p>`}
  if(t=="mul"){const n=X[0].length;
    if(n!=Y.length)return E(`Cannot multiply: A has ${n} columns but B has ${Y.length} rows. Each row of A is paired with a column of B, so these two numbers must match.`);
    const R=X.map((r,i)=>Y[0].map((_,j)=>r.reduce((s,x,k)=>s+x*Y[k][j],0)));
    out.innerHTML=`<p>Result is ${X.length}×${Y[0].length}. Pick an entry to see how it is built:</p><div id="mr">${show(R)}</div><div class="row">Row <select id="pi">${X.map((_,i)=>`<option>${i+1}</option>`)}</select> Column <select id="pj">${Y[0].map((_,j)=>`<option>${j+1}</option>`)}</select></div><div id="stp"></div>`;
    const go2=()=>{const i=$("#pi").value-1,j=$("#pj").value-1;
      $("#mr").innerHTML=show(R,(p,q)=>p==i&&q==j?"hl":"");
      $("#stp").innerHTML=`<div class="step">c<sub>${i+1}${j+1}</sub> = row ${i+1} of A · column ${j+1} of B</div><div class="step">= ${X[i].map((x,k)=>`(${fmt(x)})(${fmt(Y[k][j])})`).join(" + ")}</div><div class="step">= ${fmt(R[i][j])}</div>`};
    $("#pi").onchange=$("#pj").onchange=go2;go2()}}
nav();home();
</script></body></html>
