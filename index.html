/* ---------- matrix helpers ---------- */
function Ed(el,r,c,init,opts={}){ // editable matrix
  const o={r,c,v:[]};
  function draw(){
    el.innerHTML="";
    const g=document.createElement("div");g.className="mx";g.style.gridTemplateColumns=`repeat(${o.c},auto)`;
    for(let i=0;i<o.r;i++)for(let j=0;j<o.c;j++){
      const inp=document.createElement("input");inp.type="text";inp.inputMode="decimal";inp.setAttribute("aria-label",`row ${i+1} column ${j+1}`);
      inp.value=(o.v[i]&&o.v[i][j]!==undefined)?o.v[i][j]:0;
      inp.oninput=()=>{(o.v[i]=o.v[i]||[])[j]=inp.value;opts.on&&opts.on(i,j)};
      inp.onfocus=()=>{opts.sel&&opts.sel(i,j)};
      (o.v[i]=o.v[i]||[])[j]=inp.value;g.append(inp)}
    el.append(g);opts.on&&opts.on()}
  o.resize=(r2,c2)=>{o.r=r2;o.c=c2;draw()};
  o.get=()=>{const m=[];for(let i=0;i<o.r;i++){m[i]=[];for(let j=0;j<o.c;j++){const t=String(o.v[i][j]).trim().replace(",",".");const x=Number(t);if(t===""||!isFinite(x))return{err:`Entry in row ${i+1}, column ${j+1} (“${t}”) is not a number.`};m[i][j]=x}}return{m}};
  if(init)o.v=init;draw();return o}
const fmt=x=>Number.isInteger(x)?String(x):String(+x.toFixed(4));
function show(m,hl){ // static matrix html
  return `<div class="mx" style="grid-template-columns:repeat(${m[0].length},auto)">`+m.map((r,i)=>r.map((x,j)=>`<span class="${hl&&hl(i,j)||""}">${fmt(x)}</span>`).join("")).join("")+`</div>`}
function det(m){const n=m.length;if(n==1)return m[0][0];if(n==2)return m[0][0]*m[1][1]-m[0][1]*m[1][0];let d=0;for(let j=0;j<n;j++)d+=(j%2?-1:1)*m[0][j]*det(m.slice(1).map(r=>r.filter((_,k)=>k!=j)));return d}
function classify(m){const r=m.length,c=m[0].length,t=[];const all=(f)=>m.every((row,i)=>row.every((x,j)=>f(x,i,j)));
  t.push(`order ${r}×${c}`);t.push(`${r*c} entries`);
  if(r==1&&c==1)t.push("single entry");else if(r==1)t.push("row matrix");else if(c==1)t.push("column matrix");
  if(all(x=>x==0))t.push("zero matrix");
  if(r==c){t.push("square");
    if(all((x,i,j)=>i==j?x==1:x==0))t.push("identity matrix");
    if(all((x,i,j)=>i==j||x==0))t.push("diagonal");
    if(r>1&&all((x,i,j)=>i<=j||x==0))t.push("upper triangular");
    if(r>1&&all((x,i,j)=>i>=j||x==0))t.push("lower triangular");
    if(all((x,i,j)=>x==m[j][i])&&r>1)t.push("symmetric")}
  return t}

/* ---------- Dashboard ---------- */
let timer=null,left=1800;
function home(){
  const tot=1,dn=Object.keys(S.done).length,mt=S.mins[today()]||0;

  <div class="grid">
   <div class="card"><h3>Track A · Matrices and linear algebra</h3><div class="bar"><i style="width:${dn/6*100}%"></i></div>
    <p class="mute">All six matrix modules are open. Finish them and the calculus track is next.</p>
    <div class="row"><button class="b" onclick="go('l1')">${S.done.l1?"Revisit lesson 1":"Start lesson 1"}</button><button class="b" onclick="go('l2')">${S.done.l2?"Revisit lesson 2":"Start lesson 2"}</button><button class="b" onclick="go('l3')">${S.done.l3?"Revisit lesson 3":"Start lesson 3"}</button><button class="b" onclick="go('l4')">${S.done.l4?"Revisit lesson 4":"Start lesson 4"}</button><button class="b" onclick="go('l5')">${S.done.l5?"Revisit lesson 5":"Start lesson 5"}</button><button class="b" onclick="go('l6')">${S.done.l6?"Revisit lesson 6":"Start lesson 6"}</button></div></div>
   <div class="card"><h3>Track B · Calculus</h3><div class="bar"><i style="width:${(S.done.c1?16:0)+(S.done.c2?17:0)+(S.done.c3?17:0)+(S.done.c4?17:0)+(S.done.c5?17:0)+(S.done.c6?16:0)}%"></i></div>
    <p class="mute">All six modules are built, from functions to multivariable calculus.</p><button class="b" onclick="go('c1')">${S.done.c1?"Revisit module 1":"Start module 1"}</button><button class="b" onclick="go('c2')">${S.done.c2?"Revisit module 2":"Start module 2"}</button><button class="b" onclick="go('c3')">${S.done.c3?"Revisit module 3":"Start module 3"}</button><button class="b" onclick="go('c4')">${S.done.c4?"Revisit module 4":"Start module 4"}</button><button class="b" onclick="go('c5')">${S.done.c5?"Revisit module 5":"Start module 5"}</button><button class="b" onclick="go('c6')">${S.done.c6?"Revisit module 6":"Start module 6"}</button></div></div>
  </div>
  <div class="card"><h3>Today’s 30 minutes</h3>
   <div class="big m" id="clk">30:00</div><div class="row"><button class="b" id="tb" onclick="tgl()">Start session</button><button class="g" onclick="rst()">Reset clock</button></div>
   <p class="mute">Logged today: <span id="mn">${mt}</span> min. A good session: 5 min read, 10 min experiment, 15 min practice and recall.</p></div>
  <div class="card"><h3>Mistakes to revisit</h3><p class="mute">${S.mist.length?S.mist.length+" question(s) waiting in Review.":"None yet. Mistakes are collected here so you can revise exactly what slipped."}</p></div>
  <div class="card"><h3>Study tools</h3><div class="row"><button class="b" onclick="go('asm')">Module assessments</button><button class="g" onclick="go('lib')">Formulas &amp; glossary</button><button class="g" onclick="go('lab')">Matrix lab</button><button class="g" onclick="go('rev')">Review mistakes</button></div><p class="mute">Suggested 30 minutes: 5 recall (write what you remember), 15 lesson or experiment, 10 practice. Finish each module with its assessment.</p></div><div class="card"><h3>Settings</h3><button class="g" onclick="wipe()">Reset all progress</button></div>`;
  paint()}
function paint(){const e=$("#clk");if(e)e.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}
function tgl(){if(timer){clearInterval(timer);timer=null;$("#tb")&&($("#tb").textContent="Resume");return}
  $("#tb").textContent="Pause";timer=setInterval(()=>{left--;if(left%60==0){S.mins[today()]=(S.mins[today()]||0)+1;save();$("#mn")&&($("#mn").textContent=S.mins[today()])}paint();if(left<=0){clearInterval(timer);timer=null}},1000)}
function rst(){clearInterval(timer);timer=null;left=1800;$("#tb").textContent="Start session";paint()}
function wipe(){if(confirm("Delete all progress, notes and mistakes on this device? This cannot be undone.")){localStorage.removeItem(KEY);S={done:{},notes:"",mist:[],ans:{},rec:{},mins:{},asm:{}};go("home")}}

/* ---------- Lesson 1 ---------- */
const Q=[
 {id:"q1",lv:1,t:"mc",q:"A matrix has order 3×4. Which statement is correct?",o:["3 columns and 4 rows","3 rows and 4 columns, 12 entries","7 entries","It must be square"],a:1,h:"Order is always rows × columns, in that order.",e:"Order m×n means m rows and n columns, so 3×4 has 3·4 = 12 entries."},
 {id:"q2",lv:2,t:"num",q:"For A = [[2, 5, 1],[0, 7, 3]], find a₂₃ (row 2, column 3).",a:3,h:"First index is the row. Count down to row 2, then across to column 3.",e:"Row 2 is (0, 7, 3). Its third entry is 3."},
 {id:"q3",lv:2,t:"num",q:"A 3×3 matrix has a_ij = i + j when i ≥ j, otherwise 0. Find the sum of all its entries.",a:21,h:"Write out the 3×3 grid. Only the diagonal and below are non-zero.",e:"Entries: row1: 2,0,0 · row2: 3,4,0 · row3: 4,5,6. Sum = 2+3+4+4+5+6 = 24? Check: 2+3+4=9, +4+5+6=15, total 24."},
 {id:"q4",lv:1,t:"mc",q:"Are [[1,2],[3,4]] and [[1,3],[2,4]] equal matrices?",o:["Yes, same numbers","No, equal matrices need every matching position equal","Yes, same order","Only if multiplied"],a:1,h:"Equality compares position by position, not the collection of numbers.",e:"Entry a₁₂ is 2 in the first matrix and 3 in the second, so they differ. Position matters."},
 {id:"q5",lv:3,t:"num",q:"How many different 2×2 matrices can you build if every entry must be 0 or 1?",a:16,h:"Each entry is an independent choice with 2 options. How many entries are there?",e:"4 entries, 2 choices each: 2·2·2·2 = 16."}
];
Q[2].a=24;Q[2].e="Entries: row 1: 2, 0, 0 · row 2: 3, 4, 0 · row 3: 4, 5, 6. Sum = 2+0+0+3+4+0+4+5+6 = 24.";
let E1=null;
function l1(){
  E1=null;
  $("#v").innerHTML=`<p class="mute">Track A · Module 1 · Lesson 1</p><h1>What exactly is a matrix, and why do we need one?</h1>
  <h2>1 · The big idea</h2><p>A matrix is a rectangular table of numbers that we treat as <em>one single object</em>. That last part is the whole point: a shop’s sales for a week, the pixels of a photo, the positions of a 3D model — each is a pile of numbers, and a matrix lets us carry the whole pile around, name it, and do arithmetic on all of it at once.</p>
  <h2>2 · Why it exists</h2><p>In the 1800s, Cayley and Sylvester studied systems with many unknowns at once, like <span class="m">2x + 3y = 8</span> and <span class="m">x − y = 1</span>. Writing the same coefficients again and again was wasteful, and they noticed the coefficients themselves followed their own rules. Pull the numbers out, keep their positions, and a new object appears.</p>
  <h2>3 · Visual intuition</h2><p>Think of a spreadsheet. Three shops sell three drinks. The table of units sold is a matrix: <b>rows are shops, columns are drinks</b>. Position carries meaning.</p>
  <div class="card" style="text-align:center">${show([[12,8,5],[7,15,9],[10,6,14]],(i,j)=>i==1&&j==2?"hl":"")}<div class="mute">Shop 2 sold 9 of drink 3 (highlighted).</div></div>
  <h2>4 · Notation</h2><p>We name a matrix with a capital letter, <span class="m">A</span>. If it has <span class="m">m</span> rows and <span class="m">n</span> columns, its <b>order</b> is <span class="m">m × n</span> (rows first). The entry in row <span class="m">i</span>, column <span class="m">j</span> is <span class="m">a<sub>ij</sub></span>. So <span class="m">a<sub>23</sub></span> is “row 2, column 3”, never the other way round.</p>
  <h2>5 · Derivation: how many entries?</h2><p>Each of the <span class="m">m</span> rows holds <span class="m">n</span> entries, so the total is <span class="m">m × n</span>. A 3×4 matrix has 12 entries. Counting is multiplication; that is also why the order is written as a product.</p>
  <h2>6 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> <span class="m">B = [[1,0,4],[3,2,6]]</span> has 2 rows and 3 columns, so order 2×3, with 6 entries, and <span class="m">b<sub>13</sub> = 4</span>.</div>
  <div class="card"><span class="lbl">Intermediate.</span> Build a 2×2 matrix with <span class="m">a<sub>ij</sub> = 2i − j</span>. Substitute: a₁₁ = 1, a₁₂ = 0, a₂₁ = 3, a₂₂ = 2. So the matrix is <span class="m">[[1,0],[3,2]]</span>. The rule produces every entry; one formula describes a whole table.</div>
  <div class="card"><span class="lbl">Challenging.</span> Find x and y if <span class="m">[[x+y, 3],[5, x−y]] = [[7, 3],[5, 1]]</span>. Equal matrices match position by position, so x+y = 7 and x−y = 1. Adding: 2x = 8, x = 4, y = 3. Check: 4+3 = 7 and 4−3 = 1. ✓ Equality of matrices turned one statement into several equations.</div>
  <h2>7 · Interactive experiment</h2><p>Resize the matrix, type any numbers, and click a cell. The lab names the cell and classifies the matrix. Try to make it an <b>identity</b>, then a <b>triangular</b> one.</p>
  <div class="card"><div class="row">Rows <select id="er">${[1,2,3,4].map(n=>`<option ${n==3?"selected":""}>${n}</option>`)}</select> Columns <select id="ec">${[1,2,3,4].map(n=>`<option ${n==3?"selected":""}>${n}</option>`)}</select></div>
  <div id="e1" style="overflow-x:auto"></div><div id="e1i" class="m big"></div><div id="e1t"></div></div>
  <h2>8 · In the real world</h2><p>A grayscale photo is a matrix whose entries are brightness values. A 1080×1920 phone screen is a matrix with over 2 million entries. Games rotate 3D worlds by multiplying matrices. Search engines rank pages with enormous ones. Same idea, different size.</p>
  <h2>9 · Active recall</h2><p class="mute">Close your eyes first, then write in your own words. Then compare.</p>
  ${[["r1","Explain to a friend what “order 3×2” means and why order 2×3 is a different matrix."],["r2","Why does the position of a number matter in a matrix, but not in a set?"]].map(r=>`<div class="card"><p>${r[1]}</p><textarea id="${r[0]}" oninput="S.rec['${r[0]}']=this.value;save()">${S.rec[r[0]]||""}</textarea></div>`).join("")}
  <details class="card"><summary>Check against a model answer</summary><p>Order 3×2 means 3 rows and 2 columns, 6 entries. 2×3 has 2 rows and 3 columns, a different shape, so they can never be equal. Position matters because a₁₂ and a₂₁ describe different places in the table, like (row, column) coordinates on a map.</p></details>
  <h2>10 · Practice</h2><p class="mute">Attempt first. Hints appear on request, explanations after you submit.</p><div id="qs"></div>
  <h2>11 · Summary</h2><div class="card"><p>A matrix packages a table of numbers into one object. Rows run across, columns run down, order is rows × columns, and entry <span class="m">a<sub>ij</sub></span> is found by (row, column). Two matrices are equal only when their orders match and every position agrees. Special shapes — square, zero, identity, diagonal, triangular — are the vocabulary we will use in every later module.</p>
  <button class="b" onclick="S.done.l1=1;save();this.textContent='Lesson complete ✓'">Mark lesson complete</button></div>`;
  E1=Ed($("#e1"),3,3,[[1,0,0],[0,1,0],[0,0,1]],{on:info,sel:(i,j)=>{$("#e1i").innerHTML=`Cell a<sub>${i+1}${j+1}</sub> = row ${i+1}, column ${j+1}`}});
  $("#er").onchange=$("#ec").onchange=()=>{E1.resize(+$("#er").value,+$("#ec").value)};
  function info(){if(!E1)return;const g=E1.get();$("#e1t").innerHTML=g.err?`<span class="err">${g.err}</span>`:classify(g.m).map(t=>`<span class="tag">${t}</span>`).join("")}
  info();curM=1;qs()}
let curM=1;
function qs(m=curM){
  $("#qs").innerHTML=Q.filter(q=>(q.m||1)==m).map(q=>{const a=S.ans[q.id];return `<div class="card"><span class="tag">Level ${q.lv}</span><p>${q.q}</p>
   ${q.t=="mc"?q.o.map((o,i)=>`<label class="o"><input type="radio" name="${q.id}" value="${i}" ${a&&a.v==i?"checked":""} ${a?"disabled":""}> ${o}</label>`).join(""):`<input class="n" type="number" step="any" id="${q.id}" value="${a?a.v:""}" ${a?"disabled":""} placeholder="your answer">`}
   <div class="row" style="margin-top:8px">${a?"":`<button class="b" onclick="chk('${q.id}')">Submit</button><button class="g" onclick="$('#h${q.id}').hidden=false">Hint</button>`}</div>
   <p id="h${q.id}" class="mute" hidden>Hint: ${q.h}</p>
   <div id="f${q.id}">${a?fb(q,a.ok):""}</div></div>`}).join("")}
const fb=(q,ok)=>`<p class="${ok?"ok":"err"}">${ok?"Correct.":"Not quite."}</p><p>${q.e}</p>`;
function chk(id){const q=Q.find(x=>x.id==id);let v;
  if(q.t=="mc"){const c=document.querySelector(`input[name=${id}]:checked`);if(!c){$("#f"+id).innerHTML='<p class="err">Choose an option first.</p>';return}v=+c.value}
  else{const t=$("#"+id).value.trim();if(t===""||!isFinite(+t)){$("#f"+id).innerHTML='<p class="err">Enter a number, for example 12.</p>';return}v=+t}
  const ok=v===q.a;S.ans[id]={v,ok};if(!ok&&!S.mist.includes(id))S.mist.push(id);if(ok)S.mist=S.mist.filter(x=>x!=id);save();qs()}

/* ---------- Lesson 2: operations ---------- */
Q.push(
 {id:"q6",m:2,lv:1,t:"mc",q:"A is 2×3 and B is 3×5. What is the order of AB?",o:["3×3","2×5","2×3","AB is undefined"],a:1,h:"Columns of A must equal rows of B. The outer numbers give the result.",e:"The inner numbers match (3 and 3), so AB exists. The outer numbers give its order: 2×5."},
 {id:"q7",m:2,lv:2,t:"num",q:"A = [[1,2],[3,4]], B = [[2,0],[1,3]]. Find the entry in row 2, column 2 of AB.",a:12,h:"Pair row 2 of A with column 2 of B, multiply in pairs, then add.",e:"Row 2 of A is (3, 4); column 2 of B is (0, 3). 3·0 + 4·3 = 12."},
 {id:"q8",m:2,lv:1,t:"mc",q:"Which statement is true for matrices A and B of the same order?",o:["AB = BA always","A + B = B + A always","AB is always defined","A + B is defined for any two matrices"],a:1,h:"Addition works entry by entry on ordinary numbers. What does that guarantee?",e:"Each entry is a number sum a+b = b+a, so A+B = B+A. Multiplication is not commutative, and addition needs equal orders."},

let P=null,R2=null;
function l2(){
  P=R2=null;
  $("#v").innerHTML=`<p class="mute">Track A · Module 2 · Lesson 2</p><h1>Doing arithmetic with whole tables</h1>
  <h2>1 · The big idea</h2><p>Adding and scaling matrices is exactly what you expect: do it entry by entry. Multiplying is different, and strange at first: it is <em>not</em> entry by entry. It is built so that one matrix can describe a process and another matrix can describe a second process, and their product describes “do one, then the other”.</p>
  <h2>2 · Why it exists</h2><p>Suppose y₁ = 2x₁ + 3x₂ and y₂ = x₁ + 4x₂, and then x₁ = z₁ + z₂ and x₂ = 2z₁ − z₂. Go straight from z to y. Mathematicians wanted one rule that does this substitution automatically, so repeated substitutions become one calculation.</p>
  <h2>3 · Visual intuition</h2><p>Entry-by-entry addition needs two tables of the same shape, like laying one transparent grid on another.</p>
  <div class="card" style="text-align:center">${show([[1,2],[3,4]])} + ${show([[5,6],[7,8]])} = ${show([[6,8],[10,12]])}</div>
  <p>Multiplication pairs a <b>row</b> of the first matrix with a <b>column</b> of the second, like matching a shop’s sales list against a price list.</p>
  <div class="card" style="text-align:center">${show([[10,5]],(i,j)=>"hl")} × ${show([[3],[4]],(i,j)=>"hl2")} = ${show([[50]])}<div class="mute">10·3 + 5·4 = 50: revenue from 10 of one drink at 3 and 5 of another at 4.</div></div>
  <h2>4 · The rules</h2><p><b>Addition and subtraction:</b> only when both matrices have the same order; then <span class="m">(A ± B)<sub>ij</sub> = a<sub>ij</sub> ± b<sub>ij</sub></span>.<br><b>Scalar multiple:</b> <span class="m">(kA)<sub>ij</sub> = k·a<sub>ij</sub></span>.<br><b>Product:</b> A (m×n) times B (n×p) is defined, with order m×p, when the <em>inner</em> numbers match. Its entry is <span class="m">(AB)<sub>ij</sub> = a<sub>i1</sub>b<sub>1j</sub> + a<sub>i2</sub>b<sub>2j</sub> + … + a<sub>in</sub>b<sub>nj</sub></span>.</p>
  <h2>5 · Derivation: why the product has this form</h2><p>Take y₁ = a₁₁x₁ + a₁₂x₂, and x₁ = b₁₁z₁ + b₁₂z₂, x₂ = b₂₁z₁ + b₂₂z₂. Substitute:</p>
  <div class="step">y₁ = a₁₁(b₁₁z₁ + b₁₂z₂) + a₁₂(b₂₁z₁ + b₂₂z₂)</div>
  <div class="step">y₁ = (a₁₁b₁₁ + a₁₂b₂₁) z₁ + (a₁₁b₁₂ + a₁₂b₂₂) z₂</div>
  <p>The coefficient of z₁ is a₁₁b₁₁ + a₁₂b₂₁: row 1 of A against column 1 of B. The row-by-column rule is not arbitrary; it is what substitution forces. And the inner sizes match because the x’s produced by B are the x’s consumed by A.</p>
  <h2>6 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> With A = [[1,2],[3,4]] and B = [[5,6],[7,8]]: A + B = [[6,8],[10,12]] and 2A = [[2,4],[6,8]]. Each entry is handled on its own.</div>
  <div class="card"><span class="lbl">Intermediate.</span> A = [[1,2],[3,4]], B = [[0,1],[1,0]].<br>AB: row 1·col 1 = 1·0 + 2·1 = 2; row 1·col 2 = 1·1 + 2·0 = 1; row 2·col 1 = 3·0 + 4·1 = 4; row 2·col 2 = 3.<div style="text-align:center">AB = ${show([[2,1],[4,3]])} BA = ${show([[3,4],[1,2]])}</div>Right-multiplying by B swapped A’s <em>columns</em>; left-multiplying swapped its <em>rows</em>. So AB ≠ BA.</div>
  <div class="card"><span class="lbl">Challenging.</span> Find x if [[1,x],[0,1]]² = [[1,6],[0,1]]. Multiply: top-right entry = 1·x + x·1 = 2x, other entries stay 1, 0, 1. So 2x = 6 and x = 3. Spotting the pattern, [[1,x],[0,1]]ⁿ = [[1,nx],[0,1]], which is how you would compute a 100th power without 99 multiplications.</div>
  <h2>7 · Interactive experiment</h2><p>Choose a size, change the entries, and watch the results. Try to find two matrices where AB = BA. Is it easy? What do they have in common?</p>
  <div class="card"><div class="row">Size <select id="pn"><option>2</option><option>3</option></select> (square)</div>
  <div class="row" style="align-items:flex-start"><div><b>A</b><div id="pa" style="overflow-x:auto"></div></div><div><b>B</b><div id="pb" style="overflow-x:auto"></div></div></div><div id="pout"></div></div>
  <h2>8 · In the real world</h2><p>A game character’s movement is a chain: rotate, then scale, then translate. Each step is a matrix, and the product of the matrices is the whole move, applied to thousands of points in one go. Order matters: rotating then moving is not moving then rotating, which is exactly non-commutativity. Spreadsheets of costs times quantities, and population models that step forward year by year, use the same product.</p>
  <h2>9 · Active recall</h2><p class="mute">Write before you check.</p>
  ${[["r3","State the condition for AB to exist, and how to find the order of the result without computing anything."],["r4","Why is AB generally different from BA? Give a reason, not just an example."]].map(r=>`<div class="card"><p>${r[1]}</p><textarea oninput="S.rec['${r[0]}']=this.value;save()">${S.rec[r[0]]||""}</textarea></div>`).join("")}
  <details class="card"><summary>Check against a model answer</summary><p>AB exists when A’s column count equals B’s row count; for m×n times n×p, the result is m×p. AB ≠ BA generally because AB means “apply B first, then A” and BA means the reverse; sequences of actions usually give different outcomes. Sometimes BA does not even exist when AB does.</p></details>
  <h2>10 · Practice</h2><p class="mute">Attempt first. Hints on request, explanations after you submit.</p><div id="qs"></div>
  <h2>11 · Summary</h2><div class="card"><p>Addition and scalar multiples act entry by entry and need equal orders for addition. Multiplication pairs rows with columns because it encodes “do one process, then another”. The inner orders must match, the outer orders give the result’s shape, and AB ≠ BA in general. Addition is commutative; multiplication is not.</p>
  <button class="b" onclick="S.done.l2=1;save();this.textContent='Lesson complete ✓'">Mark lesson complete</button></div>`;
  P=Ed($("#pa"),2,2,[[1,2],[3,4]],{on:cmp});R2=Ed($("#pb"),2,2,[[0,1],[1,0]],{on:cmp});
  $("#pn").onchange=()=>{const n=+$("#pn").value;P.resize(n,n);R2.resize(n,n)};
  function cmp(){if(!P||!R2||P.r!=R2.r)return;const a=P.get(),b=R2.get();

    const X=a.m,Y=b.m,AB=mm(X,Y),BA=mm(Y,X),eq=JSON.stringify(AB)==JSON.stringify(BA);
    $("#pout").innerHTML=`<div class="row">${"AB"} ${show(AB)} ${"BA"} ${show(BA)}</div><p class="${eq?"ok":"err"}">${eq?"AB = BA for this pair. That is a special case.":"AB ≠ BA: order matters."}</p><p class="mute">A + B always equals B + A: ${show(X.map((r,i)=>r.map((x,j)=>x+Y[i][j])))}</p>`}
  cmp();curM=2;qs()}

let D2=null,D3=null;
function l3(){
  D2=D3=null;
  $("#v").innerHTML=`<p class="mute">Track A · Module 3 · Lesson 3</p><h1>The number that says what a matrix does to space</h1>
  <h2>1 · The big idea</h2><p>The determinant of a square matrix is a single number with a physical meaning: it is the factor by which the matrix <em>stretches area</em> (or volume, in 3×3), with a minus sign if it also flips orientation. A determinant of 0 means everything gets crushed flat.</p>
  <h2>2 · Why it exists</h2><p>Solve ax + by = e and cx + dy = f. Multiply the first equation by d and the second by b, then subtract:</p>
  <div class="step">(ad − bc)·x = ed − bf</div>
  <p>To divide by (ad − bc) and get x, it must not be zero. That number decides whether the system has one clean solution. People found it long before matrices existed, and called it the <em>determinant</em> because it <em>determines</em> whether a solution exists.</p>
  <h2>3 · Visual intuition</h2><p>A 2×2 matrix sends the unit square to a parallelogram. Its first column is where the right-hand edge lands; its second column is where the top edge lands. The determinant is the signed area of that parallelogram. Use the experiment below to see it.</p>
  <h2>4 · The formulas</h2><p>For 2×2: <span class="m">det [[a,b],[c,d]] = ad − bc</span>.<br>For 3×3, expand along row 1 using <b>minors</b> (the 2×2 determinant left after crossing out a row and column) with alternating signs + − +:</p>
  <div class="step">det A = a₁₁·M₁₁ − a₁₂·M₁₂ + a₁₃·M₁₃</div>
  <h2>5 · Derivation: why the signs alternate</h2><p>Write each row as a combination of the standard directions. Because the determinant is linear in each row separately, it splits into three smaller pieces, one per entry in row 1. Moving a column into position past the others costs one swap each, and each swap multiplies by −1, giving + − +. You can expand along any row or column; the sign of position (i, j) is (−1)<sup>i+j</sup>, a checkerboard.</p>
  <h2>6 · Properties, with reasons</h2><div class="card"><p>• Swap two rows: det × (−1) (orientation flips).<br>• A row of zeros, or two equal rows: det = 0 (the shape is flat).<br>• Multiply one row by k: det × k (area stretches by k in that direction).<br>• So det(kA) = kⁿ·det A for n×n.<br>• det(AB) = det A · det B (stretch factors multiply when you do one transformation then another).<br>• det A = 0 exactly when A is singular (no inverse); otherwise non-singular.</p></div>
  <h2>7 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> det [[3,1],[2,4]] = 3·4 − 1·2 = 10. The unit square becomes a parallelogram of area 10.</div>
  <div class="card"><span class="lbl">Intermediate.</span> det [[2,0,1],[1,3,2],[1,1,4]]. Row 1: 2·(3·4−2·1) − 0·(1·4−2·1) + 1·(1·1−3·1) = 2·10 − 0 + (−2) = 18. The zero entry removes a whole term, so choose the row or column with the most zeros.</div>
  <div class="card"><span class="lbl">Challenging.</span> For which k is [[k,2],[3,k+1]] singular? Set k(k+1) − 6 = 0, so k² + k − 6 = 0, (k+3)(k−2) = 0, hence k = 2 or k = −3. Check k = 2: [[2,2],[3,3]] has equal-ratio rows, so it is flat. ✓</div>
  <h2>8 · Interactive experiment</h2><p>Edit the 2×2 matrix. The dashed square is the unit square; the shaded shape is its image. Try [[1,2],[2,4]]: what happens? Then try swapping its columns.</p>
  <div class="card"><div id="da"></div><svg id="dsv" viewBox="0 0 300 300" width="100%" style="max-width:320px;background:#0b111c;border-radius:8px" role="img" aria-label="unit square and its image"></svg><div id="dout"></div></div>
  <p>Now a 3×3 expansion along row 1, with every number shown:</p>
  <div class="card"><div id="db" style="overflow-x:auto"></div><div id="dout3"></div></div>
  <h2>9 · In the real world</h2><p>Engineers check the determinant of a mechanism’s Jacobian: a zero means the robot arm has lost a direction of motion. Graphics software uses a negative determinant to detect a mirrored (inside-out) triangle. In physics, volumes in changing coordinates scale by a determinant, which you will meet again in calculus.</p>
  <h2>10 · Active recall</h2><p class="mute">Write before you check.</p>
  ${[["r5","In your own words, what does det = 5 say about a transformation? And det = −5? And det = 0?"],["r6","Why must a matrix with two equal rows have determinant 0? Use the swap property."]].map(r=>`<div class="card"><p>${r[1]}</p><textarea oninput="S.rec['${r[0]}']=this.value;save()">${S.rec[r[0]]||""}</textarea></div>`).join("")}
  <details class="card"><summary>Check against a model answer</summary><p>det 5: areas become 5 times larger, orientation kept. det −5: areas ×5 and mirrored. det 0: everything flattened to a line or point, no way back. For equal rows: swapping them changes nothing, yet the swap property says det becomes −det. So det = −det, which forces det = 0.</p></details>
  <h2>11 · Practice</h2><p class="mute">Attempt first. Hints on request, explanations after you submit.</p><div id="qs"></div>
  <h2>12 · Summary</h2><div class="card"><p>The determinant is the signed area (or volume) scale factor of a square matrix. It is computed by ad − bc in 2×2 and by cofactor expansion with alternating signs in larger sizes. It is 0 exactly when the matrix flattens space, which makes the matrix singular and non-invertible. It multiplies under matrix products and flips sign under a row swap.</p>
  <button class="b" onclick="S.done.l3=1;save();this.textContent='Lesson complete ✓'">Mark lesson complete</button></div>`;
  D2=Ed($("#da"),2,2,[[2,1],[0,1.5]],{on:draw});D3=Ed($("#db"),3,3,[[2,0,1],[1,3,2],[1,1,4]],{on:exp3});

    const poly=pts.map(p=>X(p[0])+","+Y(p[1])).join(" "),col=dt==0?"#ef6f6c":dt>0?"#58d1c4":"#f0b84d";
    $("#dsv").innerHTML=`<line x1="0" y1="150" x2="300" y2="150" stroke="#26344d"/><line x1="150" y1="0" x2="150" y2="300" stroke="#26344d"/><polygon points="${X(0)},${Y(0)} ${X(1)},${Y(0)} ${X(1)},${Y(1)} ${X(0)},${Y(1)}" fill="none" stroke="#93a1b8" stroke-dasharray="4 3"/><polygon points="${poly}" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2"/><circle cx="${X(a)}" cy="${Y(c)}" r="4" fill="${col}"/><circle cx="${X(b)}" cy="${Y(d)}" r="4" fill="#e6ebf3"/>`;
    o.innerHTML=`<div class="step">det = ad − bc = (${fmt(a)})(${fmt(d)}) − (${fmt(b)})(${fmt(c)}) = ${fmt(dt)}</div><p class="${dt==0?"err":"ok"}">${dt==0?"Area 0: the square is flattened onto a line or point. The matrix is singular and has no inverse.":dt>0?`Areas are multiplied by ${fmt(dt)}. Orientation is kept.`:`Areas are multiplied by ${fmt(-dt)}, and the square is mirrored (orientation flipped).`}</p><p class="mute">Coloured dot: image of the right edge (first column). White dot: image of the top edge (second column).</p>`}
  function exp3(){if(!D3)return;const g=D3.get(),o=$("#dout3");

    const M=g.m,mn=j=>det(M.slice(1).map(r=>r.filter((_,k)=>k!=j))),m=[0,1,2].map(mn),t=[0,1,2].map(j=>(j%2?-1:1)*M[0][j]*m[j]);
    o.innerHTML=`<div class="step">Minors: M₁₁ = ${fmt(m[0])}, M₁₂ = ${fmt(m[1])}, M₁₃ = ${fmt(m[2])}</div><div class="step">det = (${fmt(M[0][0])})(${fmt(m[0])}) − (${fmt(M[0][1])})(${fmt(m[1])}) + (${fmt(M[0][2])})(${fmt(m[2])})</div><div class="step">det = ${fmt(t[0]+t[1]+t[2])}</div><p class="${t[0]+t[1]+t[2]==0?"err":"ok"}">${t[0]+t[1]+t[2]==0?"Determinant 0: singular.":"Non-zero: non-singular."}</p>`}

let I4=null;
function l4(){
  I4=null;
  $("#v").innerHTML=`<p class="mute">Track A · Module 4 · Lesson 4</p><h1>Undoing a matrix</h1>
  <h2>1 · The big idea</h2><p>An inverse matrix <span class="m">A⁻¹</span> is the matrix that <em>undoes</em> A. If A takes a point somewhere, A⁻¹ brings it straight back. Doing both leaves everything where it started, which is the identity matrix: <span class="m">A A⁻¹ = A⁻¹ A = I</span>.</p>
  <h2>2 · Why it exists</h2><p>With numbers, you solve 3x = 12 by dividing by 3, or multiplying by 1/3. Matrices have no division, but they can have an inverse, which plays the role of 1/3. Later, an inverse lets us solve a whole system of equations in one step.</p>
  <h2>3 · When can something be undone?</h2><p>A transformation can be undone only if it loses no information. If A flattens the plane onto a line (determinant 0), many points land on the same spot and there is no way to know where each came from. So <b>an inverse exists exactly when det A ≠ 0</b>. Algebraically: det A · det A⁻¹ = det I = 1, and no number times 0 equals 1.</p>
  <h2>4 · The 2×2 formula, and where it comes from</h2><p>Multiply A = [[a,b],[c,d]] by [[d,−b],[−c,a]]:</p>
  <div class="step">[[a,b],[c,d]] · [[d,−b],[−c,a]] = [[ad−bc, 0],[0, ad−bc]] = (ad−bc)·I</div>
  <p>Divide by the number ad − bc (possible only if it is not 0) and we have an inverse:</p>
  <div class="step">A⁻¹ = (1 / (ad − bc)) · [[d, −b],[−c, a]]</div>
  <p>In words: swap the diagonal entries, negate the other two, divide by the determinant.</p>
  <h2>5 · The 3×3 method, and why it works</h2><p>Replace each entry by its <b>cofactor</b> (± the minor, with the checkerboard sign pattern) to get the cofactor matrix C. Transpose it to get the <b>adjugate</b>: adj A = Cᵀ. Then:</p>
  <div class="step">A⁻¹ = (1 / det A) · adj A</div>
  <p>Why: multiplying a row of A by the matching row of cofactors is exactly the expansion of det A. Multiplying a row of A by a <em>different</em> row of cofactors is the expansion of a matrix with two equal rows, which is 0 (Lesson 3). So A · adj A has det A on the diagonal and 0 elsewhere: (det A)·I.</p>
  <h2>6 · Properties</h2><div class="card"><p>• The inverse is unique.<br>• (A⁻¹)⁻¹ = A.<br>• (AB)⁻¹ = B⁻¹A⁻¹: undo in reverse order, like taking off shoes before socks.<br>• det A⁻¹ = 1 / det A.</p></div>
  <h2>7 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> A = [[2,1],[5,3]]. det = 6 − 5 = 1, so A⁻¹ = [[3,−1],[−5,2]]. Verify: row 1 · column 1 = 2·3 + 1·(−5) = 1, row 1 · column 2 = 2·(−1) + 1·2 = 0, and the other two entries come out 0 and 1. So AA⁻¹ = I. ✓</div>
  <div class="card"><span class="lbl">Intermediate.</span> A = [[4,7],[2,6]]. det = 24 − 14 = 10. A⁻¹ = (1/10)[[6,−7],[−2,4]] = [[0.6,−0.7],[−0.2,0.4]]. A determinant of 10 means A stretches area tenfold, so A⁻¹ shrinks it to a tenth.</div>
  <div class="card"><span class="lbl">Challenging.</span> A = [[1,2,0],[0,1,3],[2,0,1]]. det = 1(1−0) − 2(0−6) + 0 = 13. Cofactor matrix C = [[1,6,−2],[−2,1,4],[6,−3,1]]. Transpose for adj A = [[1,−2,6],[6,1,−3],[−2,4,1]]. So A⁻¹ = (1/13)·adj A. Check one entry: row 1 of A · column 1 of adj A = 1·1 + 2·6 + 0 = 13, and 13/13 = 1. ✓ Paste this matrix into the experiment to confirm every entry.</div>
  <h2>8 · Interactive experiment</h2><p>Choose a size, enter a matrix, and watch the method step by step. Then try to make it singular. What do you notice about the rows?</p>
  <div class="card"><div class="row">Size <select id="in"><option>2</option><option>3</option></select></div><div id="ia" style="overflow-x:auto"></div><div id="iout"></div></div>
  <h2>9 · In the real world</h2><p>A secret message can be scrambled by multiplying by a matrix, and only someone who knows its inverse can unscramble it (the Hill cipher). Graphics software uses inverses to map a click on the screen back to a point in the 3D scene. Scientists use them to recover the real signal from distorted instrument readings.</p>
  <h2>10 · Active recall</h2><p class="mute">Write before you check.</p>
  ${[["r7","Explain, without a formula, why a matrix with determinant 0 cannot have an inverse."],["r8","Why is (AB)⁻¹ equal to B⁻¹A⁻¹ and not A⁻¹B⁻¹? Use a real-life example."]].map(r=>`<div class="card"><p>${r[1]}</p><textarea oninput="S.rec['${r[0]}']=this.value;save()">${S.rec[r[0]]||""}</textarea></div>`).join("")}
  <details class="card"><summary>Check against a model answer</summary><p>det 0 means the matrix squashes different points onto the same place, so given the output you cannot tell which input produced it; no operation can reverse that. Also det A · det A⁻¹ = 1 is impossible if det A = 0. For the product: AB means B happens first and A second, so undoing must reverse that order, like taking off your shoes before your socks.</p></details>
  <h2>11 · Practice</h2><p class="mute">Attempt first. Hints on request, explanations after you submit.</p><div id="qs"></div>
  <h2>12 · Summary</h2><div class="card"><p>The inverse of A undoes A, and exists exactly when det A ≠ 0. For 2×2, swap the diagonal, negate the other two entries and divide by the determinant. For larger sizes, A⁻¹ = adj A / det A. Always verify by checking that A · A⁻¹ = I. Inverses reverse order in products.</p>

function gauss(A){const E=1e-9,M=A.map(r=>r.slice()),n=M.length,w=M[0].length-1,st=[],piv=[],cp=()=>M.map(x=>x.map(y=>Math.abs(y)<E?0:y));let r=0;
  for(let c=0;c<w&&r<n;c++){let p=-1;for(let i=r;i<n;i++)if(Math.abs(M[i][c])>E){p=i;break}
    if(p<0)continue;
    if(p!=r){[M[p],M[r]]=[M[r],M[p]];st.push([`Swap R${r+1} and R${p+1} to get a non-zero pivot in column ${c+1}.`,cp()])}
    const v=M[r][c];if(Math.abs(v-1)>E){M[r]=M[r].map(x=>x/v);st.push([`R${r+1} ← R${r+1} ÷ ${fmt(v)} (make the pivot 1).`,cp()])}
    for(let i=0;i<n;i++)if(i!=r&&Math.abs(M[i][c])>E){const m=M[i][c];M[i]=M[i].map((x,j)=>x-m*M[r][j]);st.push([`R${i+1} ← R${i+1} ${m>0?"−":"+"} ${fmt(Math.abs(m))}·R${r+1} (clear column ${c+1}).`,cp()])}
    piv.push(c);r++}
  const F=cp();return{M:F,st,piv,w,bad:F.findIndex(row=>row.slice(0,w).every(x=>x==0)&&row[w]!=0)}}

function l5(){
  G5=null;
  $("#v").innerHTML=`<p class="mute">Track A · Module 5 · Lesson 5</p><h1>Solving many equations at once</h1>
  <h2>1 · The big idea</h2><p>A system like x + 2y = 5 and 3x + 4y = 6 is a single matrix equation: <span class="m">AX = B</span>, where A holds the coefficients, X the unknowns and B the right-hand sides. Solving the system means finding the X that A turns into B.</p>
  <div class="card" style="text-align:center">${show([[1,2],[3,4]])}<span class="mx" style="grid-template-columns:auto"><span>x</span><span>y</span></span> = ${show([[5],[6]])}<div class="mute">Multiplying the first row by (x, y) gives x + 2y, which must be 5.</div></div>
  <h2>2 · Why it exists</h2><p>Real problems have many unknowns at once: currents in a circuit, forces on a bridge, prices from receipts. Substituting by hand gets painful beyond three unknowns. A systematic method that works for any size is what lets computers solve systems with millions of unknowns.</p>
  <h2>3 · Visual intuition</h2><p>Each equation in two unknowns is a line. A solution is a point on every line.</p>
  <div class="card"><p>• <b>One solution:</b> the lines cross at a single point (det A ≠ 0).<br>• <b>No solution:</b> parallel lines that never meet (inconsistent).<br>• <b>Infinitely many:</b> the lines are the same line (consistent, with free variables).</p></div>
  <p>In 3 unknowns each equation is a plane. The same three outcomes occur. Try them in the experiment below.</p>
  <h2>4 · Method 1: the inverse</h2><p>If det A ≠ 0, multiply both sides of AX = B <em>on the left</em> by A⁻¹ (order matters, since multiplication is not commutative):</p>
  <div class="step">A⁻¹AX = A⁻¹B ⇒ IX = A⁻¹B ⇒ X = A⁻¹B</div>
  <p>Neat, but only when A is square and invertible, and finding A⁻¹ is expensive. The next method always works.</p>
  <h2>5 · Method 2: Gaussian elimination</h2><p>Write the <b>augmented matrix</b> [A | B] and use three <b>row operations</b>, none of which changes the solutions:</p>
  <div class="card"><p>1. Swap two rows. 2. Multiply a row by a non-zero number. 3. Add a multiple of one row to another.</p></div>
  <p>Each one is reversible, which is why the solutions survive: whatever satisfied the old equations satisfies the new ones, and you can get back. The aim is a <b>staircase</b> (row echelon form) and, going further, <b>reduced form</b> where each pivot is 1 with zeros above and below.</p>
  <h2>6 · Derivation: row operations are matrices</h2><p>Each row operation equals multiplying on the left by an <b>elementary matrix</b>, the identity with that operation applied. Example: R2 ← R2 − 2R1 uses E = [[1,0],[−2,1]]:</p>

  <p>Every elementary matrix is invertible (undo the operation). If a chain of them turns A into I, then Eₖ…E₂E₁A = I, so <span class="m">A⁻¹ = Eₖ…E₂E₁</span>. Gaussian elimination is secretly computing the inverse.</p>
  <h2>7 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> x + 2y = 5, 3x + 4y = 6. A = [[1,2],[3,4]], det = −2, A⁻¹ = [[−2,1],[1.5,−0.5]]. X = A⁻¹B = [−2·5 + 1·6, 1.5·5 − 0.5·6] = [−4, 4.5]. Check: −4 + 9 = 5 ✓, −12 + 18 = 6 ✓.</div>
  <div class="card"><span class="lbl">Intermediate.</span> x + y + z = 6, 2x − y + z = 3, x + 2y − z = 2.<br>R2 ← R2 − 2R1: (0, −3, −1 | −9). R3 ← R3 − R1: (0, 1, −2 | −4).<br>R2 ← R2 + 3R3: (0, 0, −7 | −21), so z = 3. Back-substitute: y − 2z = −4 gives y = 2, then x = 6 − 2 − 3 = 1. Solution (1, 2, 3). ✓</div>
  <div class="card"><span class="lbl">Challenging.</span> For which k does x + 2y = 3, 2x + ky = 6 have a unique solution, infinitely many, or none? R2 ← R2 − 2R1 gives (k − 4)y = 0. If k ≠ 4: y = 0 and x = 3, unique. If k = 4: the row is 0 = 0, so infinitely many (one line). Change the right side 6 to 7 with k = 4 and the row becomes 0 = 1, which is impossible: none. So the right-hand side matters only when det A = 0.</div>

  <h2>9 · In the real world</h2><p>Kirchhoff’s laws turn a circuit into a system for its currents. Structural engineers solve systems for the forces in every beam of a truss. GPS solves a system to find your position from satellite distances. Chemists balance equations by solving a linear system for the coefficients.</p>

function l6(){
  L6=V6=null;
  $("#v").innerHTML=`<p class="mute">Track A · Module 6 · Lesson 6</p><h1>Matrices as motions, and the directions that survive them</h1>
  <h2>1 · The big idea</h2><p>Every matrix is a machine that moves the whole plane (or space): it stretches, turns, shears or flattens it. A vector is just an arrow from the origin, and the matrix tells every arrow where to go. Some special arrows only get stretched or shrunk and keep their direction: those are <b>eigenvectors</b>, and they reveal what the matrix really does.</p>
  <h2>2 · Why it exists</h2><p>Physicists studying vibrating strings, rotating bodies and quantum systems found that complicated motions split into a few independent simple ones. Finding those special directions turns a hard coupled problem into easy separate ones.</p>
  <h2>3 · Linear transformations and why columns matter</h2><p>A transformation T is <b>linear</b> if it respects addition and scaling: <span class="m">T(u + v) = T(u) + T(v)</span> and <span class="m">T(cu) = cT(u)</span>. Grid lines stay straight, parallel and evenly spaced, and the origin stays put. Every such T in the plane is a matrix, and here is why. Any vector is a combination of the basis vectors:</p>
  <div class="step">(x, y) = x·(1,0) + y·(0,1) ⇒ T(x,y) = x·T(1,0) + y·T(0,1)</div>
  <p>So knowing only where (1,0) and (0,1) land fixes everything. Put those two images in as the columns and you have the matrix. That is exactly why matrix multiplication is a row-times-column rule.</p>
  <h2>4 · Vectors, independence, span, basis</h2><div class="card"><p>• <b>Span</b> of some vectors: everything you can build as a combination of them.<br>• <b>Linearly independent</b>: none of them can be built from the others. Dependent vectors add no new direction.<br>• <b>Basis</b>: independent vectors whose span is the whole space. The number needed is the <b>dimension</b>: 2 for the plane, 3 for space.<br>• n vectors in n-dimensional space are independent exactly when the matrix of those columns has det ≠ 0 (Lesson 3).</p></div>
  <h2>5 · Eigenvalues and eigenvectors: derivation</h2><p>We look for a non-zero vector v and a number λ with <span class="m">Av = λv</span>. Rewrite it as (A − λI)v = 0. A non-zero v solving this exists only when A − λI is singular (Lessons 4 and 5), so</p>
  <div class="step">det(A − λI) = 0 ⇒ λ² − (trace A)λ + det A = 0 for a 2×2 matrix</div>
  <p>Solve for λ, then for each λ solve (A − λI)v = 0 by elimination. Notice: the eigenvalues add up to the trace and multiply to the determinant.</p>
  <h2>6 · Worked examples</h2>

  $("#v").innerHTML=`<p class="mute">Track B · Calculus · Module 1</p><h1>Functions: the language calculus speaks</h1>
  <h2>1 · The big idea</h2><p>A function is a rule that takes an input and gives back exactly one output. Think of a machine: put in 3, out comes f(3). Calculus is the study of how the output <em>changes</em> when the input changes, so before we study change we must read and shape functions fluently.</p>
  <h2>2 · Why it exists</h2><p>Galileo noticed that a falling stone covers distance proportional to time squared. Descartes and Newton turned such relationships into graphs and formulas. Once distance is a function of time, you can ask how fast it is changing at one instant, which is the question that started calculus.</p>
  <h2>3 · Visual intuition</h2><p>The graph of f is every point (x, f(x)). The <b>vertical line test</b> checks that a curve is a function: a vertical line must hit it at most once, because one input has one output. A circle fails this test; a parabola passes.</p>
  <h2>4 · Notation and families</h2><div class="card"><p>• <b>f(x)</b> is read “f of x”, the output for input x. <b>Domain</b>: allowed inputs. <b>Range</b>: outputs that actually occur.<br>• <b>Composition</b> (f∘g)(x) = f(g(x)): inside function first. Order matters.<br>• <b>Inverse</b> f⁻¹ undoes f, as with matrices.<br>• <b>Polynomial</b>: 2x³ − x + 5. <b>Rational</b>: a ratio of polynomials, undefined where the denominator is 0.<br>• <b>Exponential</b> aˣ: constant ratio growth. <b>Logarithm</b>: logₐ x is its inverse, defined for x > 0.<br>• <b>Trigonometric</b>: sin and cos are the coordinates of a point travelling round the unit circle; they repeat every 2π and stay between −1 and 1.</p></div>
  <h2>5 · Derivation: why transformations behave as they do</h2><p>Why does f(x − 2) shift the graph <em>right</em> by 2? Let h(x) = f(x − 2). Then h(5) = f(3): the new graph at x = 5 shows what the old graph showed at x = 3. Every feature appears 2 units later, so to the right. Similarly the general form</p>
  <div class="step">y = a·g( b(x − c) ) + d</div>
  <p>acts in this order on a point of g: b rescales the input (horizontally, by 1/b), c shifts it right, a rescales the output (vertically) and d lifts it. Logarithms come from the exponent law aˣ·aʸ = aˣ⁺ʸ: since log undoes the exponent, log(MN) = log M + log N, turning multiplication into addition.</p>
  <h2>6 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> f(x) = 2x² − 3. f(−2) = 2·4 − 3 = 5. Domain: all real x. Since x² ≥ 0, f(x) ≥ −3, so the range is y ≥ −3.</div>

  <h2>7 · Interactive experiment: the function plotter</h2><p>Choose a base function g (grey dashed), then bend it with a, b, c, d (amber). Move the test input x₀ to see its output; if x₀ is outside the domain, the plotter says so. Try 1/x with c = 2, then √x with b = −1: where does the graph live?</p>

  <h2>8 · In the real world</h2><p>Projectile height is a quadratic in time. Bacteria and money in a bank grow exponentially. Earthquake and sound scales (Richter, decibels) and acidity (pH) are logarithms, because they compress huge ranges. Sound, light, alternating current and the seasons are sine waves with a shifted, stretched form a·sin(b(x − c)) + d.</p>

function c2(){
  $("#v").innerHTML=`<p class="mute">Track B · Calculus · Module 2</p><h1>Limits: what happens as we get close</h1>
  <h2>1 · The big idea</h2><p>A limit answers one question: <em>as the input gets closer and closer to a, what value is the output heading toward?</em> It does not matter what happens exactly at a, or whether the function is even defined there. Limits let us talk about “infinitely close” without dividing by zero.</p>
  <h2>2 · Why it exists</h2><p>How fast is a car moving at one instant? Speed is distance ÷ time, but over a single instant both are zero: 0/0, meaningless. Newton and Leibniz needed to ask what the average speed approaches as the time interval shrinks. That “approaches” is a limit. Zeno’s ancient paradoxes (you can never reach the wall since you must first cover half the distance) are really about infinite sums approaching a limit.</p>
  <h2>3 · Visual intuition</h2><p>Walk along the graph towards x = a from both sides. If both walkers head to the same height L, that height is the limit, even if there is a hole in the graph exactly at a. If they head to different heights, or off to infinity, or never settle, there is no (finite) limit.</p>
  <h2>4 · Definitions and notation</h2><div class="card"><p>• <b>lim (x→a) f(x) = L</b>: f(x) gets as close to L as we like by taking x close enough to a, with x ≠ a.<br>• <b>One-sided limits</b>: x→a⁺ (from the right) and x→a⁻ (from the left). The two-sided limit exists exactly when both agree.<br>• <b>Infinite limit</b>: f(x) grows without bound near a (vertical asymptote). <b>Limit at infinity</b>: lim (x→∞) f(x) = L means the graph flattens onto y = L (horizontal asymptote).<br>• <b>Continuous at a</b> means three things hold: f(a) is defined, the limit exists, and they are equal. A continuous graph can be drawn without lifting the pen.<br>• <b>Indeterminate forms</b> such as 0/0 and ∞/∞ have no automatic value. They are a signal to do more algebra, not an answer.</p></div>
  <h2>5 · Derivation: why cancelling is legal</h2><p>(x² − 1)/(x − 1) and x + 1 are equal for every x ≠ 1, and they differ only at x = 1, where the first is undefined. A limit never looks at x = 1 itself, only at nearby values, where the two functions are identical. So they have the same limit, 2. That is the whole justification for “factor, cancel, substitute”. The <b>limit laws</b> (limit of a sum is the sum of limits; likewise for differences, products, constant multiples and quotients with non-zero denominator) follow because closeness to L and to M gives closeness of f+g to L+M. This is why polynomials can be handled by direct substitution.</p>
  <h2>6 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> lim (x→2) (3x + 1). Polynomials are continuous, so substitute: 3·2 + 1 = 7. Table check: x = 1.99 → 6.97, x = 2.01 → 7.03. Both sides head to 7.</div>
  <div class="card"><span class="lbl">Intermediate.</span> lim (x→3) (x² − 9)/(x − 3). Substitution gives 0/0. Factor: (x−3)(x+3)/(x−3) = x + 3 for x ≠ 3. Limit = 6.</div>
  <div class="card"><span class="lbl">Challenging.</span> lim (x→0) (√(x+4) − 2)/x. Direct substitution: 0/0, and no factoring helps. Multiply by the <b>conjugate</b>: (√(x+4) − 2)(√(x+4) + 2) = (x + 4) − 4 = x, so the fraction is x/(x(√(x+4)+2)) = 1/(√(x+4)+2) → 1/4. At infinity: lim (3x² + 2x)/(x² + 5) = lim (3 + 2/x)/(1 + 5/x²) = 3, since 1/x → 0 as x → ∞. Rule of thumb: compare the highest powers.</div>
  <h2>7 · Interactive experiment: the limit explorer</h2><p>Choose a function, then drag the slider to push x towards a. Watch the two dots close in, and read the table. Compare “removable hole” (1st), “jump” (3rd), “infinite” (4th) and “never settles” (7th). Which ones have a limit but are not continuous?</p>
  <div class="card"><div class="row">Function <select id="lp">${LP.map((q,i)=>`<option value="${i}">${q.n}</option>`).join("")}</select></div><div class="row"><label style="min-width:110px">Closeness</label><input type="range" id="lt" min="0" max="5" step="0.1" value="1" style="flex:1;min-width:140px"><span id="ltv" class="m"></span></div>
  <svg id="lsv" viewBox="0 0 300 300" width="100%" style="max-width:360px;background:#0b111c;border-radius:8px;margin-top:8px" role="img" aria-label="function near the limit point"></svg><div id="lout"></div></div>
  <h2>8 · In the real world</h2><p>Speedometers and instantaneous rates are limits of average rates. A drug’s concentration in the blood approaches a steady level: a limit at infinity. A capacitor charging, a cooling cup of tea, and terminal velocity all level off towards limits. Engineers read vertical asymptotes as resonance or failure points, where a quantity blows up.</p>
  <h2>9 · Active recall</h2><p class="mute">Write before you check.</p>
  ${[["r15","Explain why lim (x→1) (x²−1)/(x−1) can equal 2 even though the function is undefined at x = 1."],["r16","List the three conditions for a function to be continuous at a point. Give an example failing each."]].map(r=>`<div class="card"><p>${r[1]}</p><textarea oninput="S.rec['${r[0]}']=this.value;save()">${S.rec[r[0]]||""}</textarea></div>`).join("")}
  <details class="card"><summary>Check against a model answer</summary><p>The limit only looks at values near 1, not at 1 itself. Near 1 the function equals x + 1, which heads to 2, so the limit is 2 even with a hole at x = 1. Continuity needs: f(a) defined (fails for 1/x at 0); the limit exists (fails for |x|/x, a jump); and the two are equal (fails for the hole in (x²−1)/(x−1) if you define f(1) = 5).</p></details>
  <h2>10 · Practice</h2><p class="mute">Attempt first. Hints on request, explanations after you submit.</p><div id="qs"></div>
  <h2>11 · Summary</h2><div class="card"><p>A limit is the value a function approaches, never the value at the point itself. Two-sided limits exist only if the left and right agree. Indeterminate forms like 0/0 call for algebra: factor, rationalise, or divide by the highest power. At infinity, compare the leading terms. A function is continuous at a when f(a) exists, the limit exists and they match. The next module turns the limit of an average rate into the derivative.</p>
  <button class="b" onclick="S.done.c2=1;save();this.textContent='Module complete ✓'">Mark module complete</button></div>`;

function c3(){
  $("#v").innerHTML=`<p class="mute">Track B · Calculus · Module 3</p><h1>Differentiation: measuring change at an instant</h1>
  <h2>1 · The big idea</h2><p>The <b>derivative</b> of a function at a point is how fast the output is changing there, per unit change in input. Geometrically it is the <b>slope of the tangent line</b>, the straight line that just touches the graph and best imitates it near that point. If f is a car’s position, f′ is its speedometer reading.</p>
  <h2>2 · Why it exists</h2><p>Two old problems turned out to be one. Newton asked: how fast is something moving at an exact instant? Leibniz and Fermat asked: what is the slope of a curve at a single point? A straight line has one slope everywhere, but a curve’s slope changes, so you need a limit to pin it down at one spot.</p>
  <h2>3 · Visual intuition</h2><p>Pick a point P on a curve and a second point Q a distance h to the right. The line through them is a <b>secant</b>, with slope (rise over run). Slide Q towards P: the secant swings round and settles into the tangent. The derivative is the limit of those secant slopes.</p>
  <h2>4 · Definition and notation</h2><div class="step">f′(x) = lim (h→0) [ f(x + h) − f(x) ] / h</div>
  <p>This difference quotient is 0/0 at h = 0, exactly the indeterminate form from Module 2, so we always simplify first. Other notation: dy/dx, d/dx of f. If the limit exists at x, f is <b>differentiable</b> there. Differentiable implies continuous, but not the other way round: |x| has a corner at 0, so no single tangent slope exists.</p>
  <h2>5 · Derivations: where the rules come from</h2><div class="card"><p><b>Power rule.</b> For f(x) = x²: [(x+h)² − x²]/h = (2xh + h²)/h = 2x + h → 2x. In general (x+h)ⁿ = xⁿ + n xⁿ⁻¹h + (terms with h² or more), so the quotient tends to <b>n xⁿ⁻¹</b>.<br><br><b>Product rule.</b> f(x+h)g(x+h) − f(x)g(x) = f(x+h)[g(x+h) − g(x)] + g(x)[f(x+h) − f(x)]. Divide by h and let h→0: <b>(fg)′ = f g′ + g f′</b>. Both factors change, so both contribute.<br><br><b>Chain rule.</b> If y changes 3 times as fast as u, and u changes 2 times as fast as x, then y changes 6 times as fast as x. Rates multiply, like gears: <b>dy/dx = (dy/du)(du/dx)</b>, so (f(g(x)))′ = f′(g(x))·g′(x).<br><br><b>Quotient rule.</b> From the product and chain rules applied to f · g⁻¹: <b>(f/g)′ = (f′g − fg′)/g²</b>.<br><br><b>Trigonometric.</b> Expanding sin(x+h) = sin x cos h + cos x sin h, the quotient becomes sin x (cos h − 1)/h + cos x (sin h)/h. As h→0, (cos h − 1)/h → 0 and sin h / h → 1 (Module 2), leaving <b>cos x</b>.<br><br><b>Exponential and log.</b> There is a special base e ≈ 2.718 whose graph has slope equal to its height everywhere, so (eˣ)′ = eˣ. ln is its inverse, and the chain rule on e^(ln x) = x gives (ln x)′ = 1/x.</p></div>
  <div class="card"><p><b>Rule sheet.</b> (c)′ = 0 · (xⁿ)′ = n xⁿ⁻¹ · (cf)′ = c f′ · (f±g)′ = f′±g′ · (sin x)′ = cos x · (cos x)′ = −sin x · (tan x)′ = sec²x · (eˣ)′ = eˣ · (aˣ)′ = aˣ ln a · (ln x)′ = 1/x</p></div>
  <h2>6 · Implicit differentiation</h2><p>Sometimes y is tangled with x, like x² + y² = 25. Differentiate both sides with respect to x, remembering that y depends on x, so d(y²)/dx = 2y·(dy/dx) by the chain rule:</p><div class="step">2x + 2y·y′ = 0 ⇒ y′ = −x/y</div><p>No need to solve for y first.</p>
  <h2>7 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> f(x) = x³ − 4x + 7. Term by term: f′(x) = 3x² − 4. At x = 2 the slope is 12 − 4 = 8, so the tangent rises 8 for every 1 across.</div>
  <div class="card"><span class="lbl">Intermediate.</span> y = x² sin x (product): y′ = 2x sin x + x² cos x. And y = (3x² + 1)⁵ (chain): outer power gives 5(3x²+1)⁴, inner derivative is 6x, so y′ = 30x(3x²+1)⁴.</div>
  <div class="card"><span class="lbl">Challenging.</span> First principles for f(x) = 1/x: [1/(x+h) − 1/x]/h = [x − (x+h)]/[x(x+h)h] = −1/[x(x+h)] → <b>−1/x²</b>, matching the power rule with n = −1. Then on the circle x² + y² = 25 at (3, 4): y′ = −3/4. The tangent line is y − 4 = −(3/4)(x − 3), perpendicular to the radius, as geometry says it must be.</div>
  <h2>8 · Interactive experiment: secant to tangent</h2><p>Choose a function, set x₀, then shrink h with the slider. The amber secant rotates onto the teal tangent, and the table compares its slope with the exact rule. Try |x| at 0, √x at 0 and x·sin x.</p>

  <h2>9 · In the real world</h2><p>Velocity is the derivative of position and acceleration is the derivative of velocity. Economists call the derivative of cost the <em>marginal cost</em>. A population that grows in proportion to its size satisfies P′ = kP, whose solution is exponential. Doctors read the slope of a concentration curve as the rate a drug is absorbed. The next module uses f′ = 0 to find the best possible design.</p>

function c4(){
  $("#v").innerHTML=`<p class="mute">Track B · Calculus · Module 4</p><h1>Applications: motion, peaks, valleys and the best choice</h1>
  <h2>1 · The big idea</h2><p>The derivative tells you what a quantity is doing: rising, falling, or momentarily flat. That lets you describe motion exactly, find the highest and lowest points of a graph, and answer engineering questions of the form “what is the best possible…?”</p>
  <h2>2 · Why it exists</h2><p>Fermat noticed that at the top of a hill, the tangent is flat. That one observation turns “find the maximum” from guessing into solving f′(x) = 0. Kepler had asked how to build the wine barrel holding the most wine; calculus finally answers questions like that for any shape.</p>
  <h2>3 · Visual intuition</h2><p>Walk along a graph from left to right. Uphill: positive slope, f′ > 0. Downhill: f′ < 0. At the crest of a hill or bottom of a valley you pause: f′ = 0. The way the slope itself changes, bending like a bowl or a frown, is described by the second derivative f″.</p>
  <h2>4 · The toolkit</h2><div class="card"><p>• <b>Motion:</b> position s(t), velocity v = s′, acceleration a = v′ = s″. If v and a have the same sign, the object speeds up; opposite signs, it slows down.<br>• <b>Increasing / decreasing:</b> f′ > 0 / f′ < 0.<br>• <b>Critical points:</b> f′ = 0 (or undefined), the only places an interior extremum can occur.<br>• <b>First derivative test:</b> f′ changes + to − : maximum; − to + : minimum; no change: neither.<br>• <b>Second derivative test:</b> at a critical point, f″ > 0 : minimum; f″ < 0 : maximum; f″ = 0: inconclusive.<br>• <b>Concavity:</b> f″ > 0 concave up (bowl); f″ < 0 concave down (frown). An <b>inflection point</b> is where this changes.<br>• On a closed interval [a, b], also compare the endpoint values: the absolute maximum may be at an end.</p></div>
  <h2>5 · Derivation: why these tests work</h2><p><b>Fermat’s theorem.</b> Suppose f has a peak at an interior point c. If f′(c) > 0, then stepping slightly right would give a higher value, contradicting the peak. If f′(c) < 0, stepping slightly left would. The only possibility left is f′(c) = 0.<br><b>Second derivative test.</b> f″ is the slope of f′. At a critical point with f″ > 0, f′ is rising through 0, so it goes from negative to positive: the graph falls then rises, a minimum.<br><b>Related rates.</b> If two quantities are linked by a formula, and both change with time, differentiate the formula with respect to t using the chain rule. The links between their speeds appear automatically.</p>
  <h2>6 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> s(t) = t³ − 6t² + 9t. Then v = 3t² − 12t + 9 = 3(t−1)(t−3) and a = 6t − 12. The object moves right for t < 1, left for 1 < t < 3, and right again after t = 3. At t = 2: v = −3, a = 0: it is moving left at a steady instant. At t = 1 and t = 3 it is momentarily at rest and turning around.</div>
  <div class="card"><span class="lbl">Intermediate.</span> f(x) = x³ − 3x. f′ = 3x² − 3 = 3(x−1)(x+1), so critical points are x = ±1. f″ = 6x. f″(−1) = −6 < 0: local max with f(−1) = 2. f″(1) = 6 > 0: local min with f(1) = −2. f″ changes sign at 0: an inflection point there.</div>
  <div class="card"><span class="lbl">Challenging.</span> <b>Optimization.</b> A farmer has 100 m of fence for three sides of a rectangle against a straight river. Let x be the width of each side perpendicular to the river; the side parallel is 100 − 2x. Area A = x(100 − 2x) = 100x − 2x². A′ = 100 − 4x = 0 gives x = 25. A″ = −4 < 0, so it is a maximum: dimensions 25 × 50, area 1250 m². Always check the domain (0 < x < 50) and the ends. <br><b>Related rates.</b> A sphere’s volume V = (4/3)πr³, so dV/dt = 4πr² dr/dt. If dV/dt = 100 cm³/s at r = 5 cm, then dr/dt = 100/(100π) = 1/π ≈ 0.32 cm/s.</div>
  <h2>7 · Interactive experiment A: the curve analyser</h2><p>Choose a function. Teal means rising, amber means falling. The page finds every critical point in the window and classifies it. Try x³, which is flat at 0 but not a peak or valley. Move x₀ to see f′ and f″ change sign.</p>

  <h2>8 · Interactive experiment B: the best box</h2><p>Cut a square of side x from each corner of a 12 cm × 12 cm sheet and fold up the sides. Which x gives the largest volume? Find it by watching the slope V′ reach zero.</p>
  <div class="card"><div class="row"><label style="min-width:110px">Cut size x</label><input type="range" id="bx" min="0.1" max="5.9" step="0.1" value="1" style="flex:1;min-width:140px"><span id="bxv" class="m"></span></div>

  <h2>9 · In the real world</h2><p>Engineers design cans that use the least metal for a given volume, and companies find the price that maximises profit. Physicists find where a ball peaks, where a pendulum is momentarily at rest, and how fast a shadow races along a wall. Nature optimises too: light takes the quickest path, and soap bubbles minimise surface area.</p>

  <details class="card"><summary>Check against a model answer</summary><p>At a peak you cannot go higher by moving either way; if the slope were positive, a step right would climb, and if negative, a step left would. So the slope must be zero. Steps: draw and name variables; write the quantity to optimise; use the constraint to reduce to one variable; differentiate and solve f′ = 0; confirm max or min; and compare with the domain ends, because a maximum can sit at an end where the slope is not zero.</p></details>

function c5(){
  $("#v").innerHTML=`<p class="mute">Track B · Calculus · Module 5</p><h1>Integration: adding up infinitely many tiny pieces</h1>
  <h2>1 · The big idea</h2><p>Integration <em>accumulates</em>. If you know how fast something is changing, integration tells you how much it has changed in total. It is also how we find the area under a curve, and it turns out to be differentiation run backwards.</p>
  <h2>2 · Why it exists</h2><p>Archimedes found the area of a curved shape by filling it with ever more tiny polygons. Centuries later Newton and Leibniz noticed something stunning: finding that area is the <em>reverse</em> of finding a slope. Practical need: a car’s speedometer gives speed at each instant; the odometer reading is the accumulated distance, which is the integral of speed.</p>
  <h2>3 · Visual intuition</h2><p>Slice the region under a curve into thin vertical strips. Each is nearly a rectangle with height f(x) and width Δx. Add them up. With more, thinner strips the error vanishes, and the sum approaches the exact area. The experiment below shows exactly this.</p>
  <h2>4 · Definitions and notation</h2><div class="step">∫ from a to b of f(x) dx = lim (n→∞) Σ f(xᵢ*)·Δx, &nbsp; Δx = (b − a)/n</div>
  <div class="card"><p>• The <b>definite integral</b> gives <em>signed</em> area: above the axis positive, below negative.<br>• An <b>antiderivative</b> of f is a function F with F′ = f. The <b>indefinite integral</b> ∫ f dx = F(x) + C is the whole family.<br>• Linearity: ∫(cf + g) = c∫f + ∫g. Additivity: ∫ₐᵇ + ∫ᵇᶜ = ∫ₐᶜ. Reversing the limits flips the sign.<br>• <b>Basic antiderivatives:</b> ∫xⁿ dx = xⁿ⁺¹/(n+1) + C (n ≠ −1) · ∫1/x dx = ln|x| + C · ∫eˣ dx = eˣ + C · ∫sin x dx = −cos x + C · ∫cos x dx = sin x + C</p></div>
  <h2>5 · Derivations</h2><div class="card"><p><b>Area from the definition.</b> Right-end rectangles for f(x) = x² on [0, b] with n strips: Σ (ib/n)²(b/n) = (b³/n³)Σi² = (b³/n³)·n(n+1)(2n+1)/6. As n → ∞ this tends to b³/3. Matches the antiderivative x³/3, no coincidence.<br><br><b>Fundamental Theorem, part 1.</b> Let A(x) = ∫ from a to x of f. Then A(x + h) − A(x) is one thin strip of height about f(x) and width h, so [A(x+h) − A(x)]/h ≈ f(x). In the limit, <b>A′(x) = f(x)</b>: the area function is an antiderivative of f.<br><br><b>Part 2.</b> If F is any antiderivative, then A = F + C. Since A(a) = 0, C = −F(a), so <b>∫ from a to b of f = F(b) − F(a)</b>. A tedious limit of sums becomes two substitutions.<br><br><b>Substitution</b> is the chain rule backwards: ∫ f(g(x))g′(x) dx = ∫ f(u) du with u = g(x). <b>Integration by parts</b> is the product rule backwards: from (uv)′ = u′v + uv′ we get ∫ u dv = uv − ∫ v du.</p></div>
  <h2>6 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> ∫ from 0 to 3 of (2x + 1) dx. F(x) = x² + x. F(3) − F(0) = 12. Check by geometry: a trapezoid with parallel sides 1 and 7, width 3: (1+7)/2 · 3 = 12. ✓</div>
  <div class="card"><span class="lbl">Intermediate.</span> ∫ 2x cos(x²) dx. Let u = x², du = 2x dx. The integral becomes ∫ cos u du = sin u + C = sin(x²) + C. Definite: ∫ from 0 to 1 of 2x e^(x²) dx = [eᵘ] from u = 0 to u = 1 = e − 1 ≈ 1.718. Remember to change the limits with the variable.</div>
  <div class="card"><span class="lbl">Challenging.</span> By parts: ∫ x eˣ dx with u = x, dv = eˣ dx gives x eˣ − ∫ eˣ dx = (x − 1)eˣ + C. From 0 to 1: 0 − (−1) = 1. Between curves: area between y = x and y = x² on [0, 1] is ∫ (x − x²) dx = 1/2 − 1/3 = 1/6, always (top − bottom). Check any antiderivative by differentiating it.</div>
  <h2>7 · Interactive experiment A: Riemann sums</h2><p>Choose a function, an interval [a, b] and a number of strips n. Compare left, right, midpoint and trapezoid rules against the exact value. Try sin x from 0 to 6: why is the answer small even though the picture shows large areas?</p>
  <div class="card"><div class="row">Function <select id="rp">${IP.map((q,i)=>`<option value="${i}">${q.n}</option>`).join("")}</select> Method <select id="rm"><option value="L">Left</option><option value="R">Right</option><option value="M">Midpoint</option><option value="T">Trapezoid</option></select></div>
  ${[["ra","a",0,5.9,0,.1,"rav"],["rb","b",.1,6,3,.1,"rbv"],["rn","strips n",1,100,4,1,"rnv"]].map(q=>`<div class="row"><label style="min-width:90px">${q[1]}</label><input type="range" id="${q[0]}" min="${q[2]}" max="${q[3]}" step="${q[5]}" value="${q[4]}" style="flex:1;min-width:140px"><span id="${q[6]}" class="m"></span></div>`).join("")}
  <svg id="rsv" viewBox="0 0 300 300" width="100%" style="max-width:360px;background:#0b111c;border-radius:8px;margin-top:8px" role="img" aria-label="Riemann sum rectangles"></svg><div id="rout"></div></div>
  <h2>8 · Interactive experiment B: the Fundamental Theorem</h2><p>The top graph is f with the area from 0 to x shaded. The bottom graph is the accumulated area A(x). Drag x and compare: the slope of A (white tangent) always equals the height of f above it.</p>
  <div class="card"><div class="row">Function <select id="fp">${IP.map((q,i)=>`<option value="${i}">${q.n}</option>`).join("")}</select></div><div class="row"><label style="min-width:90px">x</label><input type="range" id="fx" min="0" max="6" step="0.1" value="2" style="flex:1;min-width:140px"><span id="fxv" class="m"></span></div>
  <svg id="fsv" viewBox="0 0 300 300" width="100%" style="max-width:360px;background:#0b111c;border-radius:8px;margin-top:8px" role="img" aria-label="function and its accumulated area"></svg><div id="fout"></div></div>
  <h2>9 · In the real world</h2><p>Total distance from a speed log, total water in a tank from its flow rate, work done by a changing force, electric charge from a current, and the probability of a measurement landing in a range are all integrals. Volumes of curved solids, the centre of mass of a bridge, and the total energy used in a day are too.</p>
  <h2>10 · Active recall</h2><p class="mute">Write before you check.</p>
  ${[["r21","Explain in your own words why integration and differentiation undo each other (Fundamental Theorem), using the idea of a thin strip of area."],["r22","Why can the definite integral be zero or negative even when the shaded region clearly has area? How would you find the true area?"]].map(r=>`<div class="card"><p>${r[1]}</p><textarea oninput="S.rec['${r[0]}']=this.value;save()">${S.rec[r[0]]||""}</textarea></div>`).join("")}
  <details class="card"><summary>Check against a model answer</summary><p>Adding one thin strip of width h to the area under f adds about f(x)·h, so the rate at which accumulated area grows per unit x is f(x): the derivative of the area function is f. Therefore the area function is an antiderivative, which is why evaluating F(b) − F(a) gives the area. A definite integral counts regions below the axis negatively, so they can cancel. For true area, split the interval at the zeros of f and add the absolute values of the pieces.</p></details>
  <h2>11 · Practice</h2><p class="mute">Attempt first. Hints on request, explanations after you submit.</p><div id="qs"></div>
  <h2>12 · Summary</h2><div class="card"><p>The definite integral is the limit of Riemann sums: signed area, or total accumulated change. The Fundamental Theorem connects it to antiderivatives: ∫ from a to b of f = F(b) − F(a), because the derivative of the area function is f. Substitution reverses the chain rule; integration by parts reverses the product rule. Area between curves is the integral of top minus bottom. Next: the final module, with series, differential equations and the first step into several variables.</p>

function c6(){
  $("#v").innerHTML=`<p class="mute">Track B · Calculus · Module 6</p><h1>Beyond the basics: series, differential equations and many variables</h1>
  <h2>1 · The big idea</h2><p>Three extensions of everything so far. <b>Series:</b> an infinite sum can have a finite value, and a function can be written as an endless polynomial. <b>Differential equations:</b> instead of a formula, you are given a rule for how something changes, and must find the function. <b>Multivariable calculus:</b> real quantities depend on several inputs, so derivatives and integrals get more directions.</p>
  <h2>2 · Why it exists</h2><p>Calculators compute sin(0.5) by evaluating a polynomial: the Taylor series. The laws of physics are differential equations: Newton’s F = ma links an unknown position to its second derivative. And temperature, pressure and height depend on three-dimensional position, so a slope has to be taken along each direction.</p>
  <h2>3 · Visual intuition</h2><p>A Taylor polynomial hugs a curve near a point, and each extra term widens the hug. A differential equation draws a field of tiny arrows (slopes); a solution is a curve that follows the arrows. A surface z = f(x, y) is a landscape; a partial derivative is the slope when you walk along one compass direction.</p>
  <h2>4 · The toolkit</h2><div class="card"><p>• <b>Series:</b> Σ aₙ = the limit of partial sums. <b>Geometric:</b> a + ar + ar² + … = a/(1 − r) if |r| < 1. <b>p-series</b> Σ 1/nᵖ converges iff p > 1, so the harmonic series (p = 1) diverges. <b>Ratio test:</b> if |aₙ₊₁/aₙ| → L < 1 the series converges.<br>• <b>Power series</b> Σ cₙxⁿ converge for |x| < R, the radius of convergence.<br>• <b>Taylor series</b> about a: f(x) = Σ f⁽ⁿ⁾(a)/n! · (x − a)ⁿ. Maclaurin means a = 0. Key ones: eˣ = Σ xⁿ/n!, sin x = x − x³/3! + x⁵/5! − …, cos x = 1 − x²/2! + x⁴/4! − …, 1/(1−x) = 1 + x + x² + … (|x| < 1).<br>• <b>Differential equation:</b> an equation involving a function and its derivatives. <b>Separable</b>: dy/dx = g(x)h(y) ⇒ ∫ dy/h(y) = ∫ g(x) dx. <b>Euler’s method:</b> yₙ₊₁ = yₙ + h·F(xₙ, yₙ).<br>• <b>Partial derivative</b> fₓ: differentiate in x, treating y as constant. <b>Gradient</b> ∇f = (fₓ, fᵧ). <b>Double integral</b> ∬ f dA: the volume under the surface, found as an iterated integral.</p></div>
  <h2>5 · Derivations</h2><div class="card"><p><b>Geometric series.</b> S = 1 + r + … + rᴺ⁻¹. Then rS = r + … + rᴺ, so S − rS = 1 − rᴺ, giving S = (1 − rᴺ)/(1 − r). If |r| < 1, rᴺ → 0, so the sum tends to 1/(1 − r).<br><b>Taylor coefficients.</b> Suppose f(x) = c₀ + c₁x + c₂x² + …. Differentiating k times and setting x = 0 kills every term except one: f⁽ᵏ⁾(0) = k!·cₖ. So cₖ = f⁽ᵏ⁾(0)/k!. For eˣ every derivative at 0 is 1, giving 1/k!. For sin x the derivatives at 0 cycle 0, 1, 0, −1, giving x − x³/3! + …<br><b>Separable DE.</b> dy/dx = ky ⇒ dy/y = k dx ⇒ ln|y| = kx + C ⇒ y = Ce^(kx): exponential growth or decay.<br><b>Euler.</b> Near a point the solution is almost its tangent line, so step along the slope the equation gives for a short distance h, then repeat.</p></div>
  <h2>6 · Worked examples</h2>
  <div class="card"><span class="lbl">Beginner.</span> 1/2 + 1/4 + 1/8 + … has a = 1/2, r = 1/2, sum = (1/2)/(1/2) = 1. Partial sums 0.5, 0.75, 0.875, … creep up on 1. Also 0.999… = 0.9 + 0.09 + … = 0.9/(1 − 0.1) = 1 exactly.</div>
  <div class="card"><span class="lbl">Intermediate.</span> sin(0.5) ≈ 0.5 − 0.5³/6 = 0.5 − 0.02083 = 0.47917; the true value is 0.47943, error 0.0003 from just two terms. For a population with dy/dt = 0.3y and y(0) = 100: y = 100e^(0.3t), doubling when e^(0.3t) = 2, i.e. t = ln 2/0.3 ≈ 2.31.</div>
  <div class="card"><span class="lbl">Challenging.</span> f(x, y) = x²y + 3y². fₓ = 2xy and fᵧ = x² + 6y. At (1, 2): ∇f = (4, 13), so the surface climbs fastest mostly in the y direction. Double integral of x²y over [0,1]×[0,2] = (∫₀¹x²dx)(∫₀²y dy) = (1/3)(2) = 2/3. Euler on y′ = x + y, y(0) = 1, h = 0.1: y₁ = 1 + 0.1(0 + 1) = 1.1. The exact value at 0.1 is 1.1103, so each step carries a small error that accumulates.</div>
  <h2>7 · Interactive experiment A: Taylor polynomials</h2><p>Raise the degree and watch the teal polynomial wrap round the amber function. Then choose ln(1 + x) or 1/(1 − x) and push x beyond 1: the polynomials explode instead of converging. That is the radius of convergence.</p>

  ${[["mx","x₀",0,3,1,"mxv"],["my","y₀",0,3,1,"myv"],["ma","a (x to)",.5,3,2,"mav"],["mb","b (y to)",.5,3,1,"mbv"]].map(q=>`<div class="row"><label style="min-width:90px">${q[1]}</label><input type="range" id="${q[0]}" min="${q[2]}" max="${q[3]}" step="0.1" value="${q[4]}" style="flex:1;min-width:140px"><span id="${q[5]}" class="m"></span></div>`).join("")}

  <h2>10 · In the real world</h2><p>Calculators and computers evaluate sin, cos and eˣ with truncated series. Radioactive decay, compound interest, cooling coffee, epidemics (logistic growth) and circuits are differential equations. Weather maps are fields of partial derivatives, with the gradient showing where air pressure changes fastest. Machine learning trains models by following gradients downhill, and engineers use double and triple integrals for mass, centre of gravity and total charge.</p>
  <h2>11 · Active recall</h2><p class="mute">Write before you check.</p>
  ${[["r23","How can infinitely many positive terms add to a finite number? Use 1/2 + 1/4 + 1/8 + … and also explain why 1 + 1/2 + 1/3 + … behaves differently."],["r24","What is the difference between solving an ordinary equation like x² = 4 and solving a differential equation like y′ = y? What is the answer to the second one?"]].map(r=>`<div class="card"><p>${r[1]}</p><textarea oninput="S.rec['${r[0]}']=this.value;save()">${S.rec[r[0]]||""}</textarea></div>`).join("")}
  <details class="card"><summary>Check against a model answer</summary><p>The terms 1/2, 1/4, 1/8 shrink fast enough that the partial sums approach 1 (each term halves the remaining gap). The harmonic terms shrink, but too slowly: blocks of them each add at least 1/2, so the sum is unbounded. x² = 4 asks for numbers (2 and −2); y′ = y asks for a whole function whose slope equals its height, so y = Ceˣ, a family of curves fixed by an initial condition.</p></details>
  <h2>12 · Practice</h2><p class="mute">Attempt first. Hints on request, explanations after you submit.</p><div id="qs"></div>
  <h2>13 · Summary</h2><div class="card"><p>A series is the limit of its partial sums; geometric series with |r| < 1 sum to a/(1 − r). Taylor series build a function from its derivatives at one point, valid inside a radius of convergence. A differential equation states how a quantity changes; separable ones are solved by integration, and Euler’s method follows the slope field numerically. Partial derivatives are slopes along one axis, the gradient points uphill, and double integrals measure volume. You now have the full arc from functions and limits through derivatives and integrals to these frontiers. Everything beyond is the same ideas, extended.</p>

  res.forEach(r=>{if(!r.ok&&!S.mist.includes(r.q.id))S.mist.push(r.q.id)});save();
  const lv=[1,2,3].map(l=>{const a=res.filter(r=>r.q.lv==l);return a.length?`${LV[l]}: ${a.filter(r=>r.ok).length}/${a.length}`:""}).filter(Boolean),pc=Math.round(100*sc/tot);
  $("#ares").innerHTML=`<div class="card"><h3>Score ${sc}/${tot} (${pc}%)</h3><p>${lv.join(" · ")}</p><p class="${pc>=80?"ok":pc>=60?"mute":"err"}">${pc>=80?"Strong. You can move on, then revisit this module in a few days.":pc>=60?"Solid base. Study the explanations below, then retake.":"Revisit the lesson, then try again."}</p><button class="g" onclick="go(TABK[${m-1}])">Open the lesson</button></div>`+res.map(r=>`<div class="card"><span class="tag">${LV[r.q.lv]}</span><p>${r.q.q}</p><p class="${r.ok?"ok":"err"}">${r.ok?"Correct.":(r.v===null?"Not answered.":"Your answer: "+(r.q.t=="mc"?r.q.o[r.v]:r.v)+". Not quite.")}</p><p>${r.q.e}</p></div>`).join("");
  try{$("#ares").scrollIntoView()}catch(e){}}
